services:
  db:
    image: postgres:14
    env_file: .env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: study_sprout
    expose:
      - "5432"
    volumes:
      - group-project:/var/lib/postgresql/data
      - ./src/init_data:/docker-entrypoint-initdb.d

  web:
    image: node:lts
    user: node
    working_dir: /repository
    env_file: .env
    environment:
      NODE_ENV: development
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - ./:/repository
    command: sh -c "npm install && npm start"

volumes:
  group-project:
